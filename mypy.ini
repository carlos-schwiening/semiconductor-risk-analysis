[mypy]
# Every function in the checked scope carries annotations — without these two
# flags mypy silently skips the bodies of unannotated functions, which makes a
# green run say much less than it appears to.
disallow_untyped_defs = True
disallow_incomplete_defs = True

# A suppression that is no longer needed becomes an error, so it gets removed
# instead of quietly outliving the problem it was written for. Without this,
# type: ignore comments only accumulate — nothing ever prompts their deletion.
warn_unused_ignores = True

[mypy-plotly.*]
ignore_missing_imports = True
