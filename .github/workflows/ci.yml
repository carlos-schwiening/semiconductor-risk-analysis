name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The README states a minimum Python version; running the suite against the
    # oldest supported one and the newest turns that statement into something
    # verified rather than assumed. fail-fast is off so one red version does not
    # hide the result of the others.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      # The three model entry points and their core modules are fully annotated;
      # mypy.ini rejects unannotated definitions, so these files are checked in
      # full rather than having their function bodies skipped. Still outside the
      # scope: the Merton chart/report scripts (KMV_Textbook_Chart.py,
      # DD_TimeSeries_Chart.py, Merton_Dashboard_Chart.py, Merton_Report.py,
      # GBM_Paths_Export.py), which are plotting-only and not annotated yet.
      - name: Type check (mypy)
        run: >
          mypy Merton/Merton_Model.py Merton/merton_core.py
          DCF/dcf_core.py DCF/fmp_extract.py
          DCF/DCF_Valuation.py DCF/DCF_Report.py
          MCS/Monte_Carlo_Sim.py MCS/mcs_core.py

      - name: Run tests (pytest)
        run: pytest -v
