name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      # The Merton and DCF modules are fully annotated; mypy.ini rejects
      # unannotated definitions, so this scope is checked in full rather than
      # skipping function bodies. MCS/Monte_Carlo_Sim.py is not annotated yet
      # and has known pre-existing findings — add it once it is cleaned up.
      - name: Type check (mypy)
        run: >
          mypy Merton/Merton_Model.py Merton/merton_core.py
          DCF/dcf_core.py DCF/fmp_extract.py
          DCF/DCF_Valuation.py DCF/DCF_Report.py

      - name: Run tests (pytest)
        run: pytest -v
