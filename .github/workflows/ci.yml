name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The README states a minimum Python version; running the suite against the
    # oldest supported one and the newest turns that statement into something
    # verified rather than assumed. fail-fast is off so one red version does not
    # hide the result of the others.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      # Every Python file in the three model packages is now in scope, plot
      # scripts included. mypy.ini rejects unannotated definitions, so a new
      # function without annotations fails the build even if it is correct.
      - name: Type check (mypy)
        run: >
          mypy Merton/ DCF/ MCS/ verify.py plot_style.py

      - name: Run tests (pytest)
        run: pytest -v
